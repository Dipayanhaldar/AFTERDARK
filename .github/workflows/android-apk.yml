name: Build and publish AFTERDARK Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Trigger APK build whenever wrapper config, custom icons, styles, or APK generator scripts change
    paths:
      - "capacitor.config.json"
      - "icon-192.svg"
      - "icon-512.svg"
      - "manifest.webmanifest"
      - "scripts/configure-android-apk.mjs"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: afterdark-android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not request the removed legacy SDK package named `tools`.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Create Android wrapper
        run: npx cap add android
      - name: Configure AFTERDARK Launcher Icons, Dark Theme & Notch Safe-Area
        run: node scripts/configure-android-apk.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Prepare and verify direct-download APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk afterdark.apk
          test -s afterdark.apk
          file afterdark.apk
          sha256sum afterdark.apk
      - name: Keep a build artifact if release publishing fails
        uses: actions/upload-artifact@v4
        with:
          name: afterdark-android-apk
          path: afterdark.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: AFTERDARK Android APK ${{ github.run_number }}
          body: |
            Direct-download Android build of AFTERDARK (Store-ready for GitHub Releases, PhonePe Developer / Indus Appstore, and Amazon Appstore).
            Includes the custom AFTERDARK Crescent Moon launcher icon, native dark theme (#0c0612), camera notch safe-area protection, and E2EE private chat.
          files: afterdark.apk
          make_latest: true
