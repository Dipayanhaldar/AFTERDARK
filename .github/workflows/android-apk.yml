name: Build and publish AFTERDARK Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Trigger APK build whenever wrapper config, custom icons, styles, or APK generator scripts change
    paths:
      - "capacitor.config.json"
      - "icon-192.svg"
      - "icon-512.svg"
      - "manifest.webmanifest"
      - "scripts/configure-android-apk.mjs"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: afterdark-android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK (API 35 & 36)
        uses: android-actions/setup-android@v3
        with:
          # Do not request the removed legacy SDK package named `tools`.
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Web & Store PNG Icons
        run: node scripts/configure-android-apk.mjs
      - name: Build web assets
        run: npm run build
      - name: Create Android wrapper
        run: npx cap add android
      - name: Prepare Release Signing Keystore (.jks via GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          rm -f android/app/afterdark-upload.jks android/app/afterdark-upload.keystore

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASS:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/app/afterdark-upload.jks
            test -s android/app/afterdark-upload.jks
            keytool -list -keystore android/app/afterdark-upload.jks -storepass "$KEYSTORE_PASS" > /tmp/keystore-list.txt
            DETECTED_ALIAS=$(awk -F': ' '/Alias name:/ {print $2; exit}' /tmp/keystore-list.txt | tr -d '\r')
            ALIAS_NAME="${KEY_ALIAS:-$DETECTED_ALIAS}"
            if ! grep -Fqi "Alias name: $ALIAS_NAME" /tmp/keystore-list.txt && [ -n "$DETECTED_ALIAS" ]; then
              ALIAS_NAME="$DETECTED_ALIAS"
            fi
            rm -f /tmp/keystore-list.txt
            STORE_PASS="$KEYSTORE_PASS"
            ALIAS_PASS="${KEY_PASS:-$STORE_PASS}"
          else
            STORE_PASS=$(openssl rand -hex 16)
            ALIAS_NAME="afterdark_key"
            ALIAS_PASS="$STORE_PASS"
            echo "::add-mask::$STORE_PASS"
            keytool -genkeypair -noprompt -v \
              -keystore android/app/afterdark-upload.jks \
              -storetype JKS \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -storepass "$STORE_PASS" \
              -keypass "$ALIAS_PASS" \
              -dname "CN=AFTERDARK, OU=Mobile, O=AFTERDARK, L=Hyderabad, ST=Telangana, C=IN"
          fi

          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ALIAS_PASS" >> "$GITHUB_ENV"
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure AFTERDARK Launcher Icons, Dark Theme, Notch Safe-Area & Release Signing
        run: |
          node scripts/configure-android-apk.mjs
          python3 -c "import xml.etree.ElementTree as ET, sys; [ET.parse(f) for f in sys.argv[1:]]" android/app/src/main/AndroidManifest.xml android/app/src/main/res/values/styles.xml android/app/src/main/res/values/ic_launcher_background.xml
      - name: Build Signed Release APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          rm -f app/afterdark-upload.jks app/afterdark-upload.keystore
      - name: Prepare and verify store-signed APK & AAB
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          test -s "$APK_FILE"
          test -s "$AAB_FILE"
          cp "$APK_FILE" afterdark.apk
          cp "$AAB_FILE" afterdark-release.aab
          file afterdark.apk
          sha256sum afterdark.apk afterdark-release.aab
      - name: Keep build artifacts (Signed APK, Signed AAB & Store Graphics)
        uses: actions/upload-artifact@v4
        with:
          name: afterdark-android-apk
          path: |
            afterdark.apk
            afterdark-release.aab
            public/icon-512.png
            public/feature-graphic-1024x500.png
          if-no-files-found: error
          retention-days: 30
      - name: Publish Store-Ready APK & AAB release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: AFTERDARK Store-Signed Android APK & AAB ${{ github.run_number }}
          body: |
            Store-Signed Release Android build of AFTERDARK (`com.afterdark.universe`).
            Ready for **PhonePe Indus Appstore** and direct Android phone installation.
            - `afterdark.apk`: V1+V2 Release-Signed APK (for PhonePe Indus Appstore & direct phone install)
            - `afterdark-release.aab`: Release-Signed Android App Bundle (for PhonePe Indus Appstore AAB upload)
            - `icon-512.png`: 512x512 High-Res Store Listing Icon
          files: |
            afterdark.apk
            afterdark-release.aab
            public/icon-512.png
          make_latest: true
