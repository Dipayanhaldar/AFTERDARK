name: Build AFTERDARK for PhonePe Indus Appstore (Signed AAB & APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "package.json"
      - "scripts/configure-android-apk.mjs"
      - ".github/workflows/galaxy-store-aab.yml"

permissions:
  contents: read

concurrency:
  group: afterdark-indus-store-build
  cancel-in-progress: true

jobs:
  build-indus-store:
    name: Build Signed Store Release AAB & APK (PhonePe Indus Appstore)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 35 & 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Web & Store PNG Icons
        run: node scripts/configure-android-apk.mjs

      - name: Build web application
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Prepare Release Signing Keystore (.jks via GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          rm -f android/app/afterdark-upload.jks android/app/afterdark-upload.keystore /tmp/candidate.jks /tmp/keystore-list.txt
          VALID_SECRET_KEYSTORE=0

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASS:-}" ]; then
            if printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > /tmp/candidate.jks 2>/dev/null && [ -s /tmp/candidate.jks ]; then
              if keytool -list -v -keystore /tmp/candidate.jks -storepass "$KEYSTORE_PASS" > /tmp/keystore-list.txt 2>/dev/null; then
                DETECTED_ALIAS=$(awk -F': ' '/Alias name:/ {print $2; exit}' /tmp/keystore-list.txt | tr -d '\r[:space:]')
                CANDIDATE_ALIAS="${KEY_ALIAS:-$DETECTED_ALIAS}"
                if [ -z "$CANDIDATE_ALIAS" ] || ! grep -Fqi "Alias name: $CANDIDATE_ALIAS" /tmp/keystore-list.txt; then
                  CANDIDATE_ALIAS="$DETECTED_ALIAS"
                fi
                CANDIDATE_KEY_PASS="${KEY_PASS:-$KEYSTORE_PASS}"
                if [ -n "$CANDIDATE_ALIAS" ] && keytool -importkeystore -noprompt \
                  -srckeystore /tmp/candidate.jks \
                  -srcstorepass "$KEYSTORE_PASS" \
                  -srcalias "$CANDIDATE_ALIAS" \
                  -srckeypass "$CANDIDATE_KEY_PASS" \
                  -destkeystore android/app/afterdark-upload.jks \
                  -deststoretype JKS \
                  -deststorepass "$KEYSTORE_PASS" \
                  -destalias "$CANDIDATE_ALIAS" \
                  -destkeypass "$CANDIDATE_KEY_PASS" >/dev/null 2>&1; then
                  STORE_PASS="$KEYSTORE_PASS"
                  ALIAS_NAME="$CANDIDATE_ALIAS"
                  ALIAS_PASS="$CANDIDATE_KEY_PASS"
                  VALID_SECRET_KEYSTORE=1
                  echo "Validated secret keystore, alias ($ALIAS_NAME), and private key password."
                fi
              fi
            fi
          fi
          rm -f /tmp/candidate.jks /tmp/keystore-list.txt

          if [ "$VALID_SECRET_KEYSTORE" -eq 0 ]; then
            rm -f android/app/afterdark-upload.jks
            STORE_PASS=$(openssl rand -hex 16)
            ALIAS_NAME="afterdark_key"
            ALIAS_PASS="$STORE_PASS"
            echo "::add-mask::$STORE_PASS"
            keytool -genkeypair -noprompt -v \
              -keystore android/app/afterdark-upload.jks \
              -storetype JKS \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -storepass "$STORE_PASS" \
              -keypass "$ALIAS_PASS" \
              -dname "CN=AFTERDARK, OU=Mobile, O=AFTERDARK, L=Hyderabad, ST=Telangana, C=IN"
          fi

          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ALIAS_PASS" >> "$GITHUB_ENV"

      - name: Sync Capacitor assets and plugins
        run: npx cap sync android

      - name: Apply AFTERDARK Android branding, manifest & release signing configuration
        run: |
          node scripts/configure-android-apk.mjs
          python3 -c "import xml.etree.ElementTree as ET, sys; [ET.parse(f) for f in sys.argv[1:]]" android/app/src/main/AndroidManifest.xml android/app/src/main/res/values/styles.xml android/app/src/main/res/values/ic_launcher_background.xml

      - name: Build Signed Store Release AAB and Signed Store Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          rm -f app/afterdark-upload.jks app/afterdark-upload.keystore

      - name: Verify and package PhonePe Indus Store bundle (Signed AAB + Signed APK + Store Graphics)
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -s "$AAB_FILE"
          test -s "$APK_FILE"
          mkdir -p store-output
          cp "$AAB_FILE" store-output/AFTERDARK-indus-store.aab
          cp "$APK_FILE" store-output/AFTERDARK-indus-release-signed.apk
          cp public/icon-512.png store-output/store-icon-512x512.png
          cp public/feature-graphic-1024x500.png store-output/feature-graphic-1024x500.png
          grep -E "versionCode|versionName" android/app/build.gradle | tee store-output/VERSION-DETAILS.txt
          file store-output/AFTERDARK-indus-store.aab
          file store-output/AFTERDARK-indus-release-signed.apk
          unzip -t store-output/AFTERDARK-indus-store.aab
          sha256sum store-output/AFTERDARK-indus-store.aab store-output/AFTERDARK-indus-release-signed.apk | tee store-output/SHA256SUMS.txt

      - name: Upload PhonePe Indus Appstore bundle
        uses: actions/upload-artifact@v4
        with:
          name: AFTERDARK-Indus-Store-Bundle
          path: store-output/*
          if-no-files-found: error
          retention-days: 30
