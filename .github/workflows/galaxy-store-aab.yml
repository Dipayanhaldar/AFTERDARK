name: Build AFTERDARK Multi-Store Release (Galaxy Store & PhonePe Indus Appstore)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "package.json"
      - "scripts/configure-android-apk.mjs"
      - "scripts/afterdark-signing-cert.p12.b64"
      - ".github/workflows/galaxy-store-aab.yml"

permissions:
  contents: read

concurrency:
  group: afterdark-galaxy-store-build
  cancel-in-progress: true

jobs:
  build-galaxy-store:
    name: Build Signed Store Release AAB & APK (Galaxy Store + PhonePe Indus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 35 & 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Web & Store 512x512 PNG Icons
        run: node scripts/configure-android-apk.mjs

      - name: Build web application
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Prepare Release Signing Keystore (.jks V1 + V2 Store-Compliant)
        run: |
          rm -f android/app/afterdark-upload.jks android/app/afterdark-upload.keystore /tmp/afterdark-fixed.p12
          STORE_PASS="AfterDarkStore2026"
          ALIAS_NAME="afterdark_key"
          ALIAS_PASS="AfterDarkStore2026"

          tr -d '[:space:]' < scripts/afterdark-signing-cert.p12.b64 | base64 --decode > /tmp/afterdark-fixed.p12
          keytool -importkeystore -noprompt \
            -srckeystore /tmp/afterdark-fixed.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass "$STORE_PASS" \
            -destkeystore android/app/afterdark-upload.jks \
            -deststoretype JKS \
            -deststorepass "$STORE_PASS" \
            -destkeypass "$ALIAS_PASS"
          rm -f /tmp/afterdark-fixed.p12
          test -s android/app/afterdark-upload.jks
          echo "Loaded permanent locked signing certificate into android/app/afterdark-upload.jks"

          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ALIAS_PASS" >> "$GITHUB_ENV"

      - name: Sync Capacitor assets and plugins
        run: npx cap sync android

      - name: Apply AFTERDARK Android branding, manifest & release signing configuration
        run: |
          node scripts/configure-android-apk.mjs
          python3 -c "import xml.etree.ElementTree as ET, sys; [ET.parse(f) for f in sys.argv[1:]]" android/app/src/main/AndroidManifest.xml android/app/src/main/res/values/styles.xml android/app/src/main/res/values/ic_launcher_background.xml

      - name: Build Signed Store Release AAB and Signed Store Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify and package store upload bundle (AAB + Signed APK + .jks Keystore + 512x512 Icon + Feature Graphic)
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -s "$AAB_FILE"
          test -s "$APK_FILE"
          mkdir -p store-output
          cp "$AAB_FILE" store-output/AFTERDARK-indus-store.aab
          cp "$AAB_FILE" store-output/AFTERDARK-galaxy-store.aab
          cp "$APK_FILE" store-output/AFTERDARK-store-release-signed.apk
          cp public/icon-512.png store-output/store-icon-512x512.png
          cp public/feature-graphic-1024x500.png store-output/feature-graphic-1024x500.png
          cp android/app/afterdark-upload.jks store-output/afterdark-upload.jks
          grep -E "versionCode|versionName" android/app/build.gradle | tee store-output/VERSION-DETAILS.txt
          keytool -list -v -keystore android/app/afterdark-upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > store-output/KEYSTORE-FINGERPRINTS.txt || true
          file store-output/AFTERDARK-indus-store.aab
          file store-output/AFTERDARK-store-release-signed.apk
          unzip -t store-output/AFTERDARK-indus-store.aab
          sha256sum store-output/AFTERDARK-indus-store.aab store-output/AFTERDARK-galaxy-store.aab store-output/AFTERDARK-store-release-signed.apk store-output/afterdark-upload.jks | tee store-output/SHA256SUMS.txt

      - name: Upload Galaxy Store & PhonePe Indus Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: AFTERDARK-Galaxy-Store-AAB
          path: store-output/*
          if-no-files-found: error
          retention-days: 30
