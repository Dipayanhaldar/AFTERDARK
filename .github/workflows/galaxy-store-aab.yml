name: Build AFTERDARK Multi-Store Release (Galaxy Store & PhonePe Indus Appstore)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "scripts/configure-android-apk.mjs"
      - ".github/workflows/galaxy-store-aab.yml"

permissions:
  contents: read

concurrency:
  group: afterdark-galaxy-store-build
  cancel-in-progress: true

jobs:
  build-galaxy-store:
    name: Build Signed Store Release AAB & APK (Galaxy Store + PhonePe Indus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 35 & 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Web & Store 512x512 PNG Icons
        run: node scripts/configure-android-apk.mjs

      - name: Build web application
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Prepare Release Signing Keystore (V1 + V2 Store-Compliant)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          STORE_PASS="${KEYSTORE_PASS:-AfterDarkStore2026}"
          ALIAS_NAME="${KEY_ALIAS:-afterdark_key}"
          ALIAS_PASS="${KEY_PASS:-$STORE_PASS}"
          rm -f android/app/afterdark-upload.keystore

          USE_GENERATED=0
          if [ -n "${KEYSTORE_B64:-}" ]; then
            if printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/app/afterdark-upload.keystore 2>/dev/null && [ -s android/app/afterdark-upload.keystore ]; then
              if keytool -list -keystore android/app/afterdark-upload.keystore -storepass "$STORE_PASS" > /tmp/afterdark-keystore-list.txt 2>/tmp/afterdark-keystore-error.txt; then
                DETECTED_ALIAS=$(awk -F': ' '/Alias name:/ {print $2; exit}' /tmp/afterdark-keystore-list.txt | tr -d '\r')
                if ! grep -Fqi "Alias name: $ALIAS_NAME" /tmp/afterdark-keystore-list.txt && [ -n "$DETECTED_ALIAS" ]; then
                  echo "Using detected keystore alias: $DETECTED_ALIAS"
                  ALIAS_NAME="$DETECTED_ALIAS"
                fi
                echo "Provided keystore and alias validated successfully."
              else
                echo "Provided keystore password did not match ANDROID_KEYSTORE_BASE64 — falling back to fresh release keystore generation."
                USE_GENERATED=1
              fi
            else
              echo "ANDROID_KEYSTORE_BASE64 could not be decoded — falling back to fresh release keystore generation."
              USE_GENERATED=1
            fi
          else
            USE_GENERATED=1
          fi

          if [ "$USE_GENERATED" -eq 1 ]; then
            rm -f android/app/afterdark-upload.keystore
            STORE_PASS="AfterDarkStore2026"
            ALIAS_NAME="afterdark_key"
            ALIAS_PASS="AfterDarkStore2026"
            keytool -genkeypair -noprompt -v \
              -keystore android/app/afterdark-upload.keystore \
              -storetype PKCS12 \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -storepass "$STORE_PASS" \
              -keypass "$ALIAS_PASS" \
              -dname "CN=AFTERDARK Social, OU=Mobile, O=AFTERDARK, L=Hyderabad, ST=Telangana, C=IN"
          fi

          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ALIAS_PASS" >> "$GITHUB_ENV"

      - name: Sync Capacitor assets and plugins
        run: npx cap sync android

      - name: Apply AFTERDARK Android branding, manifest & release signing configuration
        run: |
          node scripts/configure-android-apk.mjs
          python3 -c "import xml.etree.ElementTree as ET, sys; [ET.parse(f) for f in sys.argv[1:]]" android/app/src/main/AndroidManifest.xml android/app/src/main/res/values/styles.xml android/app/src/main/res/values/ic_launcher_background.xml

      - name: Build Signed Store Release AAB and Signed Store Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify and package store upload bundle (AAB + Signed APK + 512x512 Icon + Feature Graphic + Keystore Details)
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -s "$AAB_FILE"
          test -s "$APK_FILE"
          mkdir -p store-output
          cp "$AAB_FILE" store-output/AFTERDARK-indus-store.aab
          cp "$AAB_FILE" store-output/AFTERDARK-galaxy-store.aab
          cp "$APK_FILE" store-output/AFTERDARK-store-release-signed.apk
          cp public/icon-512.png store-output/store-icon-512x512.png
          cp public/feature-graphic-1024x500.png store-output/feature-graphic-1024x500.png
          cp android/app/afterdark-upload.keystore store-output/afterdark-upload.keystore
          keytool -list -v -keystore android/app/afterdark-upload.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > store-output/KEYSTORE-FINGERPRINTS.txt || true
          file store-output/AFTERDARK-indus-store.aab
          file store-output/AFTERDARK-store-release-signed.apk
          unzip -t store-output/AFTERDARK-indus-store.aab
          sha256sum store-output/AFTERDARK-indus-store.aab store-output/AFTERDARK-galaxy-store.aab store-output/AFTERDARK-store-release-signed.apk | tee store-output/SHA256SUMS.txt

      - name: Upload Galaxy Store & PhonePe Indus Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: AFTERDARK-Galaxy-Store-AAB
          path: store-output/*
          if-no-files-found: error
          retention-days: 30
