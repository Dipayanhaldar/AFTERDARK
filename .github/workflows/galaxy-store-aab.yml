name: Build AFTERDARK Multi-Store Release (Galaxy Store & PhonePe Indus Appstore)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "scripts/configure-android-apk.mjs"
      - ".github/workflows/galaxy-store-aab.yml"

permissions:
  contents: read

concurrency:
  group: afterdark-galaxy-store-build
  cancel-in-progress: true

jobs:
  build-galaxy-store:
    name: Build Signed Store Release AAB & APK (Galaxy Store + PhonePe Indus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 35 & 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Web & Store 512x512 PNG Icons
        run: node scripts/configure-android-apk.mjs

      - name: Build web application
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Prepare Release Signing Keystore (V1 + V2 Store-Compliant)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE_PASS="${KEYSTORE_PASS:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          ALIAS_NAME="${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          ALIAS_PASS="${KEY_PASS:?Missing ANDROID_KEY_PASSWORD secret}"
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          rm -f android/app/afterdark-upload.keystore
          # GitHub secrets can contain pasted line breaks or whitespace; remove those before decoding.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/app/afterdark-upload.keystore
          test -s android/app/afterdark-upload.keystore
          # Validate the decoded file and credentials before Gradle starts.
          keytool -list -keystore android/app/afterdark-upload.keystore -storepass "$STORE_PASS" -alias "$ALIAS_NAME" >/dev/null
          echo "Signing keystore decoded and validated successfully."

      - name: Sync Capacitor assets and plugins
        run: npx cap sync android

      - name: Apply AFTERDARK Android branding, manifest & release signing configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-AfterDarkStore2026}"
          export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-afterdark_key}"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          node scripts/configure-android-apk.mjs
          python3 -c "import xml.etree.ElementTree as ET, sys; [ET.parse(f) for f in sys.argv[1:]]" android/app/src/main/AndroidManifest.xml android/app/src/main/res/values/styles.xml android/app/src/main/res/values/ic_launcher_background.xml

      - name: Build Signed Store Release AAB and Signed Store Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify and package store upload bundle (AAB + Signed APK + 512x512 Icon)
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -s "$AAB_FILE"
          test -s "$APK_FILE"
          mkdir -p store-output
          cp "$AAB_FILE" store-output/AFTERDARK-galaxy-store.aab
          cp "$APK_FILE" store-output/AFTERDARK-store-release-signed.apk
          cp public/icon-512.png store-output/store-icon-512x512.png
          file store-output/AFTERDARK-galaxy-store.aab
          file store-output/AFTERDARK-store-release-signed.apk
          unzip -t store-output/AFTERDARK-galaxy-store.aab
          sha256sum store-output/AFTERDARK-galaxy-store.aab store-output/AFTERDARK-store-release-signed.apk | tee store-output/SHA256SUMS.txt

      - name: Upload Galaxy Store & PhonePe Indus Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: AFTERDARK-Galaxy-Store-AAB
          path: store-output/*
          if-no-files-found: error
          retention-days: 30
